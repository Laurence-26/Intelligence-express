<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Intelligence Express — interaction tests</title>
<style>
body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
iframe { width: 1200px; height: 700px; border: 1px solid #ccc; }
#out { font-family: ui-monospace, monospace; white-space: pre-wrap; }
.pass { color: #157f4a; } .fail { color: #c02626; font-weight: 700; }
</style></head>
<body>
<h1>Interaction tests</h1>
<p>Open this file over <code>http://</code> (e.g. <code>python -m http.server</code>) and the results appear below.
   Opening it straight from disk needs Chrome's <code>--allow-file-access-from-files</code> flag, otherwise the
   browser blocks the test from reaching into the iframe.</p>
<div id="out">running…</div>
<iframe id="f" src="../index.html"></iframe>

<script>
var log = [];
function ok(name, cond, extra) { log.push((cond ? "PASS " : "FAIL ") + name + (extra ? " [" + extra + "]" : "")); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

document.getElementById('f').addEventListener('load', function () {
  var w = this.contentWindow, d = this.contentDocument;

  function submit(form) {
    form.dispatchEvent(new w.Event("submit", { cancelable: true, bubbles: true }));
  }

  setTimeout(async function () {
    try {
      /* ---------------------------------------------------------- basics */
      ok("default lang is sw", d.documentElement.lang === "sw", d.documentElement.lang);
      ok("hero in swahili", /Hatubebi/.test(d.querySelector("h1").textContent));
      ok("title set", /Usafirishaji/.test(d.title), d.title);

      /* -------------------------------------------------------- tracking */
      ok("six demo shipments", Object.keys(w.IE_SHIPMENTS).length === 6, Object.keys(w.IE_SHIPMENTS).length);
      ok("a chip per shipment", d.querySelectorAll("#track-chips button").length === 6);
      ok("demo badge present", /majaribio/i.test(d.querySelector(".demo-badge").textContent));

      d.getElementById("track-input").value = "ie4821";  // no dash, lower case
      submit(d.getElementById("track-form"));
      ok("lenient code parsing", !d.getElementById("track-result").hidden);
      ok("route rendered", d.getElementById("track-route").textContent.indexOf("Mwanza") > -1);
      ok("status in swahili", d.getElementById("track-status").textContent === "Njiani", d.getElementById("track-status").textContent);
      ok("eta rendered", d.getElementById("track-eta").textContent.length > 0, d.getElementById("track-eta").textContent);
      ok("code echoed", d.getElementById("track-code").textContent === "IE-4821");
      ok("four stages", d.querySelectorAll("#track-stages li").length === 4);
      ok("3 of 4 stages done", d.querySelectorAll("#track-stages li.is-done").length === 3);
      ok("progress bar at 75%", d.getElementById("track-bar-fill").style.width === "75%", d.getElementById("track-bar-fill").style.width);
      ok("in-transit pill not delivered", !d.getElementById("track-status").classList.contains("is-delivered"));
      ok("4 timeline events", d.querySelectorAll("#track-events li").length === 4);
      ok("error hidden", d.getElementById("track-error").hidden);

      d.querySelectorAll("#track-chips button")[1].click();  // IE-7390, delivered
      ok("chip tracks a shipment", d.getElementById("track-code").textContent === "IE-7390");
      ok("delivered pill styled", d.getElementById("track-status").classList.contains("is-delivered"));
      ok("delivered bar full", d.getElementById("track-bar-fill").style.width === "100%");

      d.getElementById("track-input").value = "IE-0000";
      submit(d.getElementById("track-form"));
      ok("error shown for bad code", !d.getElementById("track-error").hidden);
      ok("result hidden for bad code", d.getElementById("track-result").hidden);
      ok("no invented shipment", /majaribio/i.test(d.getElementById("track-error").textContent));

      /* ---------------------------------------------------------- I Chat */
      var panel = d.getElementById("ichat-panel");
      var launch = d.getElementById("ichat-launch");
      ok("assistant starts closed", panel.hidden);

      launch.click();
      ok("assistant opens", !panel.hidden);
      ok("launch hidden while open", launch.hidden);
      ok("welcome message", /I Chat/.test(d.querySelector(".ichat-msg.from-bot").textContent));
      ok("quick replies offered", d.querySelectorAll("#ichat-chips button").length === 5);

      d.getElementById("ichat-input").value = "pickup ni bure?";
      submit(d.getElementById("ichat-form"));
      await sleep(400);
      var last = d.querySelectorAll(".ichat-msg.from-bot");
      last = last[last.length - 1];
      ok("answers pickup question", /bure/i.test(last.textContent));
      ok("offers whatsapp link", last.querySelector('a[href*="wa.me"]') !== null);

      d.getElementById("ichat-input").value = "bei ni ngapi?";
      submit(d.getElementById("ichat-form"));
      await sleep(400);
      var priceMsg = d.querySelectorAll(".ichat-msg.from-bot");
      priceMsg = priceMsg[priceMsg.length - 1];
      ok("does not invent a price", !/\d{4,}\s*(tsh|shilingi)/i.test(priceMsg.textContent));
      ok("hands pricing to the team", priceMsg.querySelector('a[href*="wa.me"]') !== null);

      d.getElementById("ichat-input").value = "IE-6310";
      submit(d.getElementById("ichat-form"));
      await sleep(400);
      var trackMsg = d.querySelectorAll(".ichat-msg.from-bot");
      trackMsg = trackMsg[trackMsg.length - 1];
      ok("assistant answers a tracking code", /Kampala/.test(trackMsg.textContent));
      ok("assistant drives the tracking panel", d.getElementById("track-code").textContent === "IE-6310");

      d.getElementById("ichat-input").value = "IE-1234";  // well-formed but unknown
      submit(d.getElementById("ichat-form"));
      await sleep(400);
      var missMsg = d.querySelectorAll(".ichat-msg.from-bot");
      missMsg = missMsg[missMsg.length - 1];
      ok("unknown code is refused, not faked", /majaribio/i.test(missMsg.textContent));

      var before = d.querySelectorAll(".ichat-msg.from-user").length;
      d.getElementById("ichat-input").value = "   ";
      submit(d.getElementById("ichat-form"));
      ok("blank message ignored", d.querySelectorAll(".ichat-msg.from-user").length === before);

      d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      ok("escape closes assistant", panel.hidden && !launch.hidden);

      /* ------------------------------------------------ language switching */
      d.querySelector('.lang-toggle button[data-lang="en"]').click();
      ok("lang attr en", d.documentElement.lang === "en");
      ok("hero in english", /We don't just/.test(d.querySelector("h1").textContent));
      ok("nav translated", d.querySelector('[data-i18n="navServices"]').textContent === "Services");
      ok("tracking re-rendered in en", d.getElementById("track-status").textContent === "In transit (cross-border)", d.getElementById("track-status").textContent);
      ok("stages translated", d.querySelectorAll("#track-stages li")[0].textContent === "Collected");
      ok("placeholder translated", d.querySelector('#pickup-modal input[name="name"]').placeholder === "Your name");
      ok("lang persisted", w.localStorage.getItem("ie-lang") === "en");

      launch.click();
      d.getElementById("ichat-input").value = "how much does it cost?";
      submit(d.getElementById("ichat-form"));
      await sleep(400);
      var enMsg = d.querySelectorAll(".ichat-msg.from-bot");
      enMsg = enMsg[enMsg.length - 1];
      ok("assistant answers in english", /quote|price|depends/i.test(enMsg.textContent));
      d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));

      /* ------------------------------------------------------ modal + forms */
      var modal = d.getElementById("pickup-modal");
      ok("modal starts hidden", modal.hidden);
      d.querySelector("[data-open-modal]").click();
      ok("modal opens", !modal.hidden);
      ok("body scroll locked", d.body.classList.contains("modal-open"));
      d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      ok("escape closes", modal.hidden);
      ok("body unlocked", !d.body.classList.contains("modal-open"));

      var opened = null;
      w.open = function (url) { opened = url; return null; };
      var form = d.querySelector(".contact .pickup-form");
      form.querySelector('[name="name"]').value = "Asha";
      form.querySelector('[name="phone"]').value = "0712345678";
      form.querySelector('[name="from"]').value = "Kariakoo";
      form.querySelector('[name="to"]').value = "Mwanza";
      form.querySelector('[name="item"]').value = "Katoni 2";
      submit(form);
      ok("whatsapp url built", !!opened && opened.indexOf("https://wa.me/255690500000?text=") === 0);
      ok("details encoded", !!opened && decodeURIComponent(opened).indexOf("Asha") > -1);
      ok("labels follow language", !!opened && decodeURIComponent(opened).indexOf("Your name") > -1);

      opened = null;
      submit(d.querySelector("#pickup-modal .pickup-form"));
      ok("empty form blocked", opened === null);

      /* -------------------------------------------------------- mobile nav */
      var tog = d.querySelector(".nav-toggle"), nav = d.getElementById("site-nav");
      var frame = document.getElementById("f");
      frame.style.width = "390px";            // phone width, so the menu rules apply
      await sleep(80);

      ok("header row wraps", w.getComputedStyle(d.querySelector(".header-inner")).flexWrap === "wrap");

      tog.click();
      ok("nav opens", nav.classList.contains("is-open") && tog.getAttribute("aria-expanded") === "true");

      // The regression this guards: the open menu used to sit on top of the logo.
      var navBox = nav.getBoundingClientRect();
      var brandBox = d.querySelector(".brand").getBoundingClientRect();
      ok("menu clears the brand", navBox.top >= brandBox.bottom - 1,
         Math.round(navBox.top) + " vs " + Math.round(brandBox.bottom));
      ok("menu spans the header", Math.round(navBox.width) > 300, Math.round(navBox.width));
      ok("cta moves into the menu", nav.querySelector(".nav-cta") !== null);
      ok("cta visible on mobile", w.getComputedStyle(nav.querySelector(".nav-cta")).display !== "none");

      d.body.click();
      ok("outside tap closes nav", !nav.classList.contains("is-open"));

      tog.click();
      nav.querySelector("a").click();
      ok("nav closes on link", !nav.classList.contains("is-open"));

      tog.click();
      d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      ok("escape closes nav", !nav.classList.contains("is-open"));

      frame.style.width = "1200px";
      await sleep(60);
      ok("cta hidden on desktop", w.getComputedStyle(nav.querySelector(".nav-cta")).display === "none");

      d.querySelector('.lang-toggle button[data-lang="sw"]').click();
      ok("back to sw", d.documentElement.lang === "sw" && /Hatubebi/.test(d.querySelector("h1").textContent));
      ok("aria-pressed correct", d.querySelector('[data-lang="sw"]').getAttribute("aria-pressed") === "true");
      ok("year filled", d.getElementById("year").textContent === String(new Date().getFullYear()), d.getElementById("year").textContent);
    } catch (e) {
      log.push("FAIL harness error: " + e.message);
    }

    var passed = log.filter(function (l) { return l.indexOf("PASS") === 0; }).length;
    var el = document.getElementById("out");
    el.textContent = "";
    log.forEach(function (line) {
      var div = document.createElement("div");
      div.className = line.indexOf("PASS") === 0 ? "pass" : "fail";
      div.textContent = line;
      el.appendChild(div);
    });
    var sum = document.createElement("h2");
    sum.textContent = "RESULTS>>" + passed + "/" + log.length + "<<END";
    el.appendChild(sum);
  }, 800);
});
</script>
</body></html>
