# Render Blueprint — https://render.com/docs/blueprint-spec
#
# The site is plain HTML, CSS and JavaScript with no dependencies, so there is
# nothing to build: Render serves the repository root as-is. Pushing to main
# redeploys automatically.

services:
  - type: web
    name: intelligence-express
    runtime: static
    buildCommand: echo "No build step - static files are served as-is"
    staticPublishPath: ./

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

      # Stylesheet and scripts must never be cached ahead of the HTML that uses
      # them: a phone holding yesterday's CSS with today's markup renders the
      # page unstyled. `no-cache` still caches — it just revalidates first, so
      # an unchanged file costs a 304 rather than a re-download.
      - path: /css/*
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: no-cache

      # Photos are the heavy part, so they keep a short cache. An hour saves
      # repeat views on a phone connection without hiding a swapped photo.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
